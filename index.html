<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローマ字タイピング ＆ 母音ウォーミングアップ</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --vowel-a: #ef4444;
      --vowel-i: #eab308;
      --vowel-u: #22c55e;
      --vowel-e: #3b82f6;
      --vowel-o: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 上部モード切り替えタブ */
    .mode-tabs {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid #334155;
      background: var(--card-bg);
      color: #94a3b8;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    header {
      background: var(--card-bg);
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    h1 { font-size: 1.1rem; color: var(--accent); }

    .status-bar {
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .control-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      border: 1px solid #334155;
    }

    .step-badge {
      font-size: 0.85rem;
      background: #334155;
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .target-display {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 4px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .target-char {
      padding: 4px 10px;
      border-radius: 8px;
      background: #334155;
      transition: all 0.15s;
    }

    .target-char.active {
      background: var(--accent);
      color: #0f172a;
      transform: scale(1.2);
      box-shadow: 0 0 12px var(--accent);
    }

    .romaji-hint {
      font-size: 1.3rem;
      color: #94a3b8;
      letter-spacing: 3px;
      min-height: 32px;
      font-family: monospace;
    }

    .romaji-typed { color: var(--accent); }
    .romaji-untyped { color: #475569; }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-next { background: #10b981; color: white; }
    .btn-next:hover { background: #059669; }

    .btn-stop { background: #ef4444; color: white; }
    .btn-stop:hover { background: #dc2626; }

    .btn-romaji { background: #a855f7; color: white; }
    .btn-romaji:hover { background: #9333ea; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      font-size: 0.85rem;
    }

    .speed-btn {
      background: #334155;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
    }
    .speed-btn:hover { background: var(--accent); color: #0f172a; }

    /* ソフトキーボード配置 */
    .keyboard-block {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      border: 1px solid #334155;
    }

    .key-row { display: flex; gap: 6px; }

    .key {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      background: #1e293b;
      color: #475569;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      border: 2px solid #334155;
      transition: all 0.15s ease;
      position: relative;
    }

    .key.active-target {
      color: #ffffff;
      border-color: #94a3b8;
      background: #334155;
    }

    .key[data-key="A"].active-target { border-color: var(--vowel-a); }
    .key[data-key="I"].active-target { border-color: var(--vowel-i); }
    .key[data-key="U"].active-target { border-color: var(--vowel-u); }
    .key[data-key="E"].active-target { border-color: var(--vowel-e); }
    .key[data-key="O"].active-target { border-color: var(--vowel-o); }

    /* 打鍵熟練度レベル（グラデーション） */
    .key.lvl-1 { background: #1e3a8a !important; color: #fff !important; }
    .key.lvl-2 { background: #065f46 !important; color: #fff !important; }
    .key.lvl-3 { background: #b45309 !important; color: #fff !important; box-shadow: 0 0 10px #f59e0b; }

    .key.pressed {
      transform: scale(0.9);
      background: #f8fafc !important;
      color: #0f172a !important;
    }

    .key-sub { font-size: 0.6rem; opacity: 0.8; margin-top: -2px; }

    /* モード非表示用 */
    .mode-section { display: none; width: 100%; flex-direction: column; gap: 16px; }
    .mode-section.active { display: flex; }
  </style>
</head>

    </div>
  </div>

    </div>

      <div class="key" data-key="S">S</div>

</div>

/* =========================================================
   共通データ ＆ Web Speech / Audio API
   ========================================================= */
const VOWEL_MAP = { 'A': 'あ', 'I': 'い', 'U': 'う', 'E': 'え', 'O': 'お' };
const keyHitCounts = { 'A':0, 'I':0, 'U':0, 'E':0, 'O':0 };

let currentMode = 'warmup'; // 'warmup' or 'main'
let audioCtx = null;

function speakVowel(kana) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const uttr = new SpeechSynthesisUtterance(kana);
    uttr.lang = 'ja-JP';
    uttr.rate = 1.3;
    uttr.pitch = 1.2;
    window.speechSynthesis.speak(uttr);
  }
}

function playBeatSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(110, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function playClickSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(750, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.04);
}

/* モード切り替え制御 */
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.mode-section').forEach(s => s.classList.remove('active'));

  if (mode === 'warmup') {
    document.getElementById('tabWarmup').classList.add('active');
    document.getElementById('secWarmup').classList.add('active');
    loadWarmupStep(currentWarmupStepIdx);

    if (warmupTimerId) clearInterval(warmupTimerId);
    initMainMode();

}

  { name: "ステップ 2（混線対策）", text: "えいえいえいえい", keys: ['E', 'I'] },
  { name: "ステップ 3（2音跳躍）", text: "ええおええええお", keys: ['E', 'O'] },
  { name: "ステップ 4（4音連続）", text: "えいえいおうおう", keys: ['E', 'I', 'O', 'U'] },
  { name: "ステップ 5（完成形）", text: "あえいうえおあお", keys: ['A', 'E', 'I', 'U', 'O'] }
];

let currentWarmupStepIdx = 0;
let warmupPhraseItems = [];
let isWarmupPlaying = true;
let warmupCharIdx = 0;
let bpm = 60;
let warmupTimerId = null;

function loadWarmupStep(idx) {
  currentWarmupStepIdx = idx;
  const stepData = WARMUP_STEPS[currentWarmupStepIdx];
  
  document.getElementById('stepBadge').innerText = `${stepData.name} / ${WARMUP_STEPS.length}`;
  warmupPhraseItems = stepData.text.split('');
  
  const container = document.getElementById('warmupTargetDisplay');
  container.innerHTML = "";
  warmupPhraseItems.forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = `target-char ${i === 0 ? 'active' : ''}`;
    span.id = `warmup-char-${i}`;
    span.innerText = ch;
    container.appendChild(span);
  });

  updateActiveKeys(stepData.keys);
  warmupCharIdx = 0;
  restartWarmupLoop();
}

function startWarmupLoop() {
  if (!isWarmupPlaying || currentMode !== 'warmup') return;
  const interval = (60 / bpm) * 1000;
  warmupTimerId = setInterval(() => {
    playBeatSound();
    highlightWarmupChar();
    warmupCharIdx = (warmupCharIdx + 1) % warmupPhraseItems.length;
  }, interval);
}

function restartWarmupLoop() {
  if (warmupTimerId) clearInterval(warmupTimerId);
  startWarmupLoop();
}

function highlightWarmupChar() {
  document.querySelectorAll('#warmupTargetDisplay .target-char').forEach(c => c.classList.remove('active'));
  const el = document.getElementById(`warmup-char-${warmupCharIdx}`);
  if (el) el.classList.add('active');
}

function nextWarmupStep() {
  loadWarmupStep((currentWarmupStepIdx + 1) % WARMUP_STEPS.length);
}

function toggleWarmupStop() {
  const btn = document.getElementById('stopBtn');
  if (isWarmupPlaying) {
    clearInterval(warmupTimerId);
    isWarmupPlaying = false;
    btn.innerText = "▶ (START)";
    btn.style.background = "#10b981";
  } else {
    isWarmupPlaying = true;
    btn.innerText = "■ (STOP)";
    btn.style.background = "#ef4444";
    startWarmupLoop();
  }
}

function changeBPM(delta) {
  bpm = Math.max(40, Math.min(200, bpm + delta));
  document.getElementById('bpmDisplay').innerText = bpm;
  if (isWarmupPlaying) restartWarmupLoop();
}

/* =========================================================
   2. メインタイピング モードのロジック
   ========================================================= */
let currentStepIdx = 0;
let currentWordIdx = 0;
let currentTypedString = "";
let activePattern = "";

function initMainMode() {
  currentWordIdx = 0;
  loadMainWord();
}

function onStepChange(stepIdx) {
  currentStepIdx = parseInt(stepIdx, 10);
  currentWordIdx = 0;
  loadMainWord();
}

function loadMainWord() {
  const stepList = STEPS_DATA[currentStepIdx];
  const item = stepList[currentWordIdx];
  currentTypedString = "";
  
  // デフォルト（画面表示用）のパターン
  activePattern = item.patterns[0];

  document.getElementById('mainWordBadge').innerText = `問題 ${currentWordIdx + 1} / ${stepList.length}`;
  document.getElementById('mainTargetWord').innerText = item.word;
  document.getElementById('mainTargetKana').innerText = item.kana;
  
  updateRomajiDisplay();

  // 問題に含まれる全パターンから必要なキーを抽出してハイライト
  const requiredKeys = new Set();
  item.patterns.forEach(pat => {
    for (let char of pat) requiredKeys.add(char);
  });
  updateActiveKeys(Array.from(requiredKeys));
}

function updateRomajiDisplay() {
  const typedPart = activePattern.substring(0, currentTypedString.length);
  const untypedPart = activePattern.substring(currentTypedString.length);

  document.getElementById('mainRomajiDisplay').innerHTML = 
    `<span class="romaji-typed">${typedPart}</span><span class="romaji-untyped">${untypedPart}</span>`;
}

function nextMainWord() {
  const stepList = STEPS_DATA[currentStepIdx];
  currentWordIdx++;
  if (currentWordIdx >= stepList.length) {
    alert(`🎉 Step ${currentStepIdx + 1} クリア！つぎのStepへ進みます。`);
    currentStepIdx = (currentStepIdx + 1) % STEPS_DATA.length;
    document.getElementById('stepSelect').value = currentStepIdx;
    currentWordIdx = 0;
  }
  loadMainWord();
}

/* 共通キーボードハイライト処理 */
function updateActiveKeys(activeKeysArray) {
  document.querySelectorAll('.key').forEach(k => {
    k.classList.remove('active-target');
    if (activeKeysArray && activeKeysArray.includes(k.dataset.key)) {
      k.classList.add('active-target');
    }
  });
}

/* =========================================================
   3. 共通打鍵イベント制御
   ========================================================= */
window.addEventListener('keydown', (e) => {
  const keyUpper = e.key.toUpperCase();
  const keyEl = document.querySelector(`.key[data-key="${keyUpper}"]`);

  if (!keyEl) return;

  keyEl.classList.add('pressed');
  setTimeout(() => keyEl.classList.remove('pressed'), 150);
  playClickSound();

  if (currentMode === 'warmup') {
    // --- ウォーミングアップモードの判定 ---
    const prevIdx = (warmupCharIdx - 1 + warmupPhraseItems.length) % warmupPhraseItems.length;
    const currIdx = warmupCharIdx;
    const nextIdx = (warmupCharIdx + 1) % warmupPhraseItems.length;

    const validKanas = [
      warmupPhraseItems[prevIdx],
      warmupPhraseItems[currIdx],
      warmupPhraseItems[nextIdx]
    ];

    const pressedKana = VOWEL_MAP[keyUpper];

    if (pressedKana && validKanas.includes(pressedKana)) {
      speakVowel(pressedKana);
      keyHitCounts[keyUpper]++;
      updateKeyLevel(keyEl, keyHitCounts[keyUpper]);
    }
  } else {
    // --- メインタイピングモードの判定 ---
    const item = STEPS_DATA[currentStepIdx][currentWordIdx];
    const testString = currentTypedString + keyUpper;

    // 入力可能なパターンの判定 (例: SI / SHI 双方への追従)
    const matchedPatterns = item.patterns.filter(p => p.startsWith(testString));

    if (matchedPatterns.length > 0) {
      if (VOWEL_MAP[keyUpper]) {
        speakVowel(VOWEL_MAP[keyUpper]);
      }
      currentTypedString = testString;
      activePattern = matchedPatterns[0]; // 打鍵に合致するパターンに表示を更新
      updateRomajiDisplay();

      if (currentTypedString === activePattern) {
        setTimeout(() => {
          nextMainWord();
        }, 120);
      }
    }
  }
});

function updateKeyLevel(el, count) {
  el.classList.remove('lvl-1', 'lvl-2', 'lvl-3');
  if (count >= 15) el.classList.add('lvl-3');
  else if (count >= 8) el.classList.add('lvl-2');
  else if (count >= 3) el.classList.add('lvl-1');

  const total = Object.values(keyHitCounts).reduce((a, b) => a + b, 0);
  if (total >= 40) document.getElementById('warmupLevelDisplay').innerText = "Lv.3 (マスター)";
  else if (total >= 15) document.getElementById('warmupLevelDisplay').innerText = "Lv.2 (いい感じ)";
}

window.onload = () => {
  loadWarmupStep(0);
};
</script>
